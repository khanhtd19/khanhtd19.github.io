<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="planetGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#55D6FF" />
      <stop offset="45%" stop-color="#648BFF" />
      <stop offset="80%" stop-color="#121C34" />
      <stop offset="100%" stop-color="#070B18" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55D6FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#648BFF" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Space glow behind planet -->
  <circle cx="32" cy="32" r="22" fill="#648BFF" opacity="0.2" filter="url(#glow)" />

  <!-- Orbital Ring Back -->
  <ellipse cx="32" cy="32" rx="28" ry="9" stroke="url(#ringGrad)" stroke-width="2.5" transform="rotate(-25 32 32)" stroke-dasharray="80 100" opacity="0.6" />

  <!-- Planet Sphere -->
  <circle cx="32" cy="32" r="16" fill="url(#planetGrad)" />

  <!-- Orbital Ring Front -->
  <ellipse cx="32" cy="32" rx="28" ry="9" stroke="url(#ringGrad)" stroke-width="2.5" transform="rotate(-25 32 32)" stroke-dasharray="100 80" filter="url(#glow)" />

  <!-- Small Satellite / Orbit Star -->
  <circle cx="50" cy="22" r="2" fill="#EAF2FF" filter="url(#glow)" />
  <circle cx="16" cy="18" r="1" fill="#55D6FF" opacity="0.8" />
  <circle cx="46" cy="46" r="1.2" fill="#A78BFA" opacity="0.8" />
</svg>
